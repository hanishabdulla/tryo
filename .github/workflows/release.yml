name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run lint

      - name: Build Windows installer
        run: npm run electron:dist -w @tryo/pos -- --win --x64 --publish never

      - name: Verify packaged app server starts
        run: npm run test:package -w @tryo/pos

      - name: Verify receipt layout and Windows spooler bridge
        run: npm run test:receipt -w @tryo/pos

      - name: Keep installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryo-pos-windows-${{ github.ref_name }}
          path: |
            apps/pos/release/*.exe
            apps/pos/release/*.blockmap

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem apps/pos/release/*.exe, apps/pos/release/*.blockmap).FullName
          $notes = @"
          ## Tryo POS for Windows

          ### Desktop startup
          - Fixes the packaged monorepo server path that prevented the Windows app from opening.
          - Verifies the embedded production server starts before a release is published.

          ### Receipt choice
          - Checkout now offers **Kitchen + customer** or **Kitchen only**.
          - The kitchen ticket always prints, avoiding unnecessary customer receipts when one is not wanted.
          - **Reprint last** follows the receipt choice made for that order.

          ### Cleaner totals
          - The final total always prints.
          - Subtotal, discount and delivery rows only appear when they are relevant.
          - Zero-value delivery fees are no longer printed.

          ### Production and exports
          - Connects to the Tryo production Convex deployment.
          - Replaces the vulnerable legacy spreadsheet package used by dashboard Excel exports.

          ### Setup
          1. Download and run the `.exe` installer.
          2. Connect an 80mm ESC/POS-compatible thermal printer and confirm its queue appears in Windows Settings > Printers & scanners. Generic / Text Only is supported.
          3. Open Tryo POS, choose **Receipt printer**, select the device, and run **Test print**.
          4. Save the printer. Completed orders then print silently and **Reprint last** remains available.

          This build uses the production Convex deployment and requires an internet connection.
          "@
          gh release create $env:GITHUB_REF_NAME $assets --title "Tryo POS $env:GITHUB_REF_NAME" --notes $notes
