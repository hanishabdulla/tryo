name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run lint

      - name: Build Windows installer
        run: npm run electron:dist -- --win --x64 --publish never

      - name: Verify receipt layout and Windows spooler bridge
        run: npm run test:receipt

      - name: Keep installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryo-pos-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.blockmap

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem release/*.exe, release/*.blockmap).FullName
          $notes = @"
          ## Tryo POS for Windows

          ### Receipt printing
          - Each submitted order prints a short kitchen ticket (order number, time, items and options, no prices) followed by the customer receipt. **Reprint last** reprints both.
          - Fixes overlapping total lines on the customer receipt.
          - Sends Windows receipts as ESC/POS raster jobs through the RAW spooler, including Generic / Text Only queues such as POS-80.
          - Feeds the paper past the print head after every receipt, then cuts (printers without a cutter ignore the cut).
          - Test prints, orders and reprints use the same receipt-only rendering pipeline; no ready-signal race.
          - Displays order-saving and printing failures and blocks duplicate clicks.

          ### Setup
          1. Download and run the `.exe` installer.
          2. Connect an 80mm ESC/POS-compatible thermal printer and confirm its queue appears in Windows Settings > Printers & scanners. Generic / Text Only is supported.
          3. Open Tryo POS, choose **Receipt printer**, select the device, and run **Test print**.
          4. Save the printer. Completed orders then print silently and **Reprint last** remains available.

          This build uses the configured Convex deployment and requires an internet connection.
          "@
          gh release create $env:GITHUB_REF_NAME $assets --title "Tryo POS $env:GITHUB_REF_NAME" --notes $notes
