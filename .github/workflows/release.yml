name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run lint

      - name: Build Windows installer
        run: npm run electron:dist -- --win --x64 --publish never

      - name: Verify receipt layout and Windows spooler bridge
        run: npm run test:receipt

      - name: Keep installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryo-pos-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.blockmap

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem release/*.exe, release/*.blockmap).FullName
          $notes = @"
          ## Tryo POS for Windows

          ### Daily till and cash settlement
          - Invoice numbers restart at #1 for each London trading day.
          - Start each day by entering the opening cash float.
          - Tracks cash received, customer change, cash added, cash removed, card sales and the expected drawer balance.
          - Settle the day with a physical cash count and an automatic over/short difference.
          - Requires an unclosed previous day to be settled before opening the next one.
          - Adds the till settlement to Dashboard → Daily summary.

          ### Customer receipt
          - Keeps the Tryo logo but removes the duplicate Tryo heading below it.
          - Makes the logo shorter and more compact for 80 mm thermal printers without distorting its proportions.

          ### Setup
          1. Download and run the `.exe` installer.
          2. Connect an 80mm ESC/POS-compatible thermal printer and confirm its queue appears in Windows Settings > Printers & scanners. Generic / Text Only is supported.
          3. Open Tryo POS, choose **Receipt printer**, select the device, and run **Test print**.
          4. Save the printer. Completed orders then print silently and **Reprint last** remains available.

          This build uses the configured Convex deployment and requires an internet connection.
          "@
          gh release create $env:GITHUB_REF_NAME $assets --title "Tryo POS $env:GITHUB_REF_NAME" --notes $notes
