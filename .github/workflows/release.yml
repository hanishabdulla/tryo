name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run lint

      - name: Build Windows installer
        run: npm run electron:dist -w @tryo/pos -- --win --x64 --publish never

      - name: Verify packaged app server starts
        run: npm run test:package -w @tryo/pos

      - name: Verify receipt layout and Windows spooler bridge
        run: npm run test:receipt -w @tryo/pos

      - name: Keep installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryo-pos-windows-${{ github.ref_name }}
          path: |
            apps/pos/release/*.exe
            apps/pos/release/*.blockmap

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem apps/pos/release/*.exe, apps/pos/release/*.blockmap).FullName
          # A literal here-string: the notes carry backticks, which PowerShell would
          # otherwise read as escape characters.
          $notes = @'
          ## Tryo POS for Windows

          ### Checkout on smaller till screens
          - The payment window now fits the available screen height and scrolls when necessary.
          - Cancel and Submit Order stay visible at the bottom, so staff can always complete an order on a 1024x768 POS display.

          ### No-bill orders
          - Adds a **No bill** choice alongside **Kitchen + customer** and **Kitchen only**.
          - No-bill orders are saved and paid normally without printing a kitchen ticket or customer receipt.

          ### Reprint customer bills
          - Adds **Reprint bill** to the top-right of every order detail window in the dashboard.
          - Reprints only the customer receipt through the receipt printer configured on the POS machine.
          - Historical totals remain exact, with stored meal, option, add-on and note details included.

          ### Setup
          1. Download and run the `.exe` installer.
          2. Replace the existing Tryo POS installation when prompted.
          3. The saved receipt-printer selection is retained across the update.

          This build uses the production Convex deployment and requires an internet connection.
          '@
          gh release create $env:GITHUB_REF_NAME $assets --title "Tryo POS $env:GITHUB_REF_NAME" --notes $notes
