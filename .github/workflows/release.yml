name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run lint

      - name: Build Windows installer
        run: npm run electron:dist -w @tryo/pos -- --win --x64 --publish never

      - name: Verify packaged app server starts
        run: npm run test:package -w @tryo/pos

      - name: Verify receipt layout and Windows spooler bridge
        run: npm run test:receipt -w @tryo/pos

      - name: Keep installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryo-pos-windows-${{ github.ref_name }}
          path: |
            apps/pos/release/*.exe
            apps/pos/release/*.blockmap

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem apps/pos/release/*.exe, apps/pos/release/*.blockmap).FullName
          # A literal here-string: the notes carry backticks, which PowerShell would
          # otherwise read as escape characters.
          $notes = @'
          ## Tryo POS for Windows

          ### Checkout rebuilt for the till screen
          - The payment window is now one wide layout - amount due and payment method, discount and receipt choice, and a built-in number pad side by side.
          - It fits a 1366x768 POS screen with nothing cut off and no scrolling, including when taking cash.
          - Quick cash buttons (5, 10, 20, 50) and an Exact button fill the cash amount in one tap.
          - Submit now shows the amount being taken.

          ### Built-in on-screen keyboard
          - The till draws its own number pad and keyboard inside the app, so the Windows touch keyboard no longer pops up over the field being filled in.
          - Dialogs reserve room for it, keeping the active field visible while typing.
          - Used for custom items, custom instructions, opening float, cash movements, cash-up and the menu editor.
          - Machines with a physical keyboard are unaffected and keep typing normally.

          ### Amend an order before it is paid
          - Every line in the current order has an **Edit** button that reopens it with its meal choice, extras, custom instructions and quantity already filled in.
          - Editing a line so that it matches another line already in the order merges the two.
          - Custom items can be edited the same way, including their quantity.

          ### Insights
          - New **Insights** tab in the dashboard: top items sold with a search box, sales by day, busiest hours and weekdays, sales by category, and how often meals and paid extras get added.
          - Date range with Today, last 7, 30 and 90 day presets.

          ### Smaller changes
          - Dashboard orders are listed newest first.
          - Summaries and the PDF export show the **median** order rather than the average, which better reflects what a typical customer spends.
          - The paid extras editor in the menu no longer collapses the name field, and its rows line up.

          ### Setup
          1. Download and run the `.exe` installer.
          2. Replace the existing Tryo POS installation when prompted.
          3. The saved receipt-printer selection is retained across the update.

          This build uses the production Convex deployment and requires an internet connection.
          '@
          gh release create $env:GITHUB_REF_NAME $assets --title "Tryo POS $env:GITHUB_REF_NAME" --notes $notes
